<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620"
     role="img" aria-labelledby="esoTitle esoDesc">
  <title id="esoTitle">Anatomy of the oesophagus, lower oesophageal sphincter and stomach</title>
  <desc id="esoDesc">Anatomical illustration showing the oesophagus descending through the diaphragm to the
    lower oesophageal sphincter and into the stomach, with arrows indicating the upward movement of acid
    when the sphincter does not close properly.</desc>

  <defs>
    <!-- muscular tube: lit from the left, as tissue reads more solid that way -->
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#F3B7A8"/>
      <stop offset="0.34" stop-color="#E59583"/>
      <stop offset="1"    stop-color="#C4705F"/>
    </linearGradient>

    <linearGradient id="tubeHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="belly" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#F2B3A2"/>
      <stop offset="0.45" stop-color="#E08B77"/>
      <stop offset="1"    stop-color="#B85F4F"/>
    </linearGradient>

    <linearGradient id="sphincter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#C4705F"/>
      <stop offset="0.4"  stop-color="#A9503F"/>
      <stop offset="1"    stop-color="#8E3E30"/>
    </linearGradient>

    <linearGradient id="diaph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#E7CFC6"/>
      <stop offset="0.5" stop-color="#D9B8AC"/>
      <stop offset="1"   stop-color="#E7CFC6"/>
    </linearGradient>

    <!-- refluxing acid -->
    <linearGradient id="acid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#E8A33D" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#E8A33D" stop-opacity="0.15"/>
    </linearGradient>

    <marker id="acidHead" viewBox="0 0 12 12" refX="6" refY="6"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#DE922C" opacity="0.9"/>
    </marker>
  </defs>

  <rect width="860" height="620" fill="#ffffff"/>

  <!-- ============================ diaphragm ============================ -->
  <g opacity="0.9">
    <path d="M92 356 C 168 330, 250 336, 300 360 L 300 372 C 248 350, 168 346, 92 372 Z" fill="url(#diaph)"/>
    <path d="M424 360 C 486 334, 574 330, 646 356 L 646 372 C 574 346, 488 350, 424 372 Z" fill="url(#diaph)"/>
  </g>

  <!-- ============================ oesophagus ============================ -->
  <!-- drawn as a stroked path so the muscular wall keeps an even calibre -->
  <path d="M336 24 C 336 118, 344 214, 350 286 C 355 342, 364 382, 374 404"
        fill="none" stroke="#A9503F" stroke-width="60" stroke-linecap="round" opacity="0.35"/>
  <path d="M336 24 C 336 118, 344 214, 350 286 C 355 342, 364 382, 374 404"
        fill="none" stroke="url(#tube)" stroke-width="54" stroke-linecap="round"/>
  <path d="M322 34 C 322 122, 330 214, 336 286"
        fill="none" stroke="url(#tubeHi)" stroke-width="13" stroke-linecap="round"/>

  <!-- circular muscle bands, faint -->
  <g stroke="#B4604E" stroke-width="2" opacity="0.22" fill="none">
    <path d="M311 84  C 330 76, 344 76, 363 84"/>
    <path d="M313 134 C 332 126, 346 126, 365 134"/>
    <path d="M316 184 C 335 176, 349 176, 368 184"/>
    <path d="M320 234 C 339 226, 353 226, 372 234"/>
    <path d="M325 284 C 344 276, 358 276, 377 284"/>
  </g>

  <!-- ================= lower oesophageal sphincter ================= -->
  <!-- a thickened, narrowed ring where the tube meets the stomach -->
  <g transform="rotate(-14 368 392)">
    <ellipse cx="368" cy="392" rx="33" ry="15" fill="url(#sphincter)"/>
    <ellipse cx="368" cy="386" rx="33" ry="15" fill="#C4705F"/>
    <ellipse cx="368" cy="386" rx="20" ry="7.5" fill="#8E3E30" opacity="0.55"/>
    <path d="M338 383 C 348 375, 388 375, 398 383" fill="none" stroke="#ffffff"
          stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- ============================== stomach ============================== -->
  <path d="M372 404
           C 330 386, 274 402, 268 458
           C 262 516, 300 566, 366 590
           C 440 616, 528 590, 570 532
           C 592 502, 600 480, 602 460
           L 640 456
           C 654 454, 658 442, 648 434
           L 598 430
           C 556 430, 512 448, 468 450
           C 428 452, 396 434, 384 406 Z"
        fill="url(#belly)" stroke="#A9503F" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- greater-curvature highlight -->
  <path d="M292 448 C 284 508, 322 556, 382 578"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.22"/>

  <!-- rugae: the folded inner lining, kept faint so it reads as texture -->
  <g stroke="#A9503F" stroke-width="2.4" fill="none" opacity="0.24" stroke-linecap="round">
    <path d="M330 448 C 356 486, 372 528, 376 566"/>
    <path d="M380 442 C 404 482, 420 524, 424 570"/>
    <path d="M430 446 C 450 486, 462 526, 464 568"/>
    <path d="M480 452 C 496 490, 504 524, 502 556"/>
    <path d="M528 462 C 540 492, 546 516, 544 538"/>
  </g>

  <!-- pylorus / duodenal cap -->
  <path d="M648 434 C 686 428, 716 446, 726 480 C 734 508, 724 534, 704 550"
        fill="none" stroke="#C4705F" stroke-width="30" stroke-linecap="round"/>
  <path d="M652 440 C 684 436, 708 452, 716 480"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.22"/>

  <!-- ======================= refluxing acid, upward ======================= -->
  <g opacity="0.92">
    <path d="M362 470 C 356 442, 352 416, 350 340"
          fill="none" stroke="url(#acid)" stroke-width="9" stroke-linecap="round"
          marker-end="url(#acidHead)"/>
    <path d="M398 486 C 388 452, 378 424, 372 366"
          fill="none" stroke="url(#acid)" stroke-width="6" stroke-linecap="round"
          marker-end="url(#acidHead)" opacity="0.7"/>
  </g>
  <g fill="#E8A33D" opacity="0.5">
    <circle cx="344" cy="300" r="4"/>
    <circle cx="358" cy="266" r="2.8"/>
    <circle cx="340" cy="238" r="2.2"/>
  </g>

  <!-- ============================== labels ============================== -->
  <g font-family="Inter, 'Segoe UI', sans-serif" fill="#6B534F">
    <g stroke="#C9A79E" stroke-width="1.4" fill="none">
      <path d="M366 150 L 470 150 L 494 138"/>
      <path d="M404 392 L 512 392 L 536 380"/>
      <path d="M596 552 L 660 552 L 684 566"/>
    </g>
    <g fill="#C9A79E">
      <circle cx="366" cy="150" r="3.4"/>
      <circle cx="404" cy="392" r="3.4"/>
      <circle cx="596" cy="552" r="3.4"/>
    </g>

    <text x="500" y="134" font-size="21" font-weight="600" fill="#4A322E">Esophagus</text>
    <text x="500" y="156" font-size="15">Muscular tube, throat to stomach</text>

    <text x="542" y="376" font-size="21" font-weight="600" fill="#4A322E">Lower esophageal sphincter</text>
    <text x="542" y="398" font-size="15">The valve that keeps acid down</text>

    <text x="690" y="562" font-size="21" font-weight="600" fill="#4A322E">Stomach</text>
    <text x="690" y="584" font-size="15">Acid reservoir below the valve</text>
  </g>
</svg>
