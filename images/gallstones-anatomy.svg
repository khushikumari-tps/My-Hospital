<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620"
     role="img" aria-labelledby="gsTitle gsDesc">
  <title id="gsTitle">Gallstones inside the gallbladder</title>
  <desc id="gsDesc">Anatomical illustration of the gallbladder beneath the liver holding several gallstones, with
    one stone lodged at the neck where the cystic duct begins, and the common bile duct running down towards
    the bowel.</desc>

  <defs>
    <linearGradient id="gsBody" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#C6D68C"/>
      <stop offset="0.36" stop-color="#9FB265"/>
      <stop offset="1"    stop-color="#6C7C3C"/>
    </linearGradient>
    <linearGradient id="gsSheen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gsDuct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#D9C88E"/>
      <stop offset="0.5" stop-color="#BFA765"/>
      <stop offset="1"   stop-color="#8E7A3E"/>
    </linearGradient>
    <linearGradient id="gsLiver" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"   stop-color="#A8494A"/>
      <stop offset="0.5" stop-color="#83262E"/>
      <stop offset="1"   stop-color="#5C1821"/>
    </linearGradient>
    <linearGradient id="gsGut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#F0B0A4"/>
      <stop offset="0.5" stop-color="#DC8B78"/>
      <stop offset="1"   stop-color="#B15E4C"/>
    </linearGradient>
    <!-- the stones: a cholesterol stone is pale and faceted, so a warm
         off-white core with a darker rim reads more honestly than grey -->
    <radialGradient id="gsStone" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0"    stop-color="#FBF3DD"/>
      <stop offset="0.55" stop-color="#E6D3A6"/>
      <stop offset="1"    stop-color="#B79A62"/>
    </radialGradient>
    <radialGradient id="gsGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#9FB265" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#9FB265" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="860" height="620" fill="#ffffff"/>
  <ellipse cx="300" cy="360" rx="300" ry="215" fill="url(#gsGlow)"/>

  <!-- ===================== liver, secondary and above ===================== -->
  <g opacity="0.9">
    <path d="M74 214 C120 142 236 100 366 108 C468 114 548 142 574 180
             C592 208 566 234 512 232 C420 228 292 232 200 250
             C130 264 62 250 74 214 Z" fill="url(#gsLiver)" opacity="0.42"/>
    <path d="M120 176 C176 140 268 124 356 128" fill="none" stroke="#ffffff"
          stroke-width="14" stroke-linecap="round" opacity="0.18"/>
  </g>

  <!-- =========================== the biliary tree =========================== -->
  <g fill="none" stroke-linecap="round">
    <path d="M296 236 C330 258 356 274 374 292" stroke="#8E7A3E" stroke-width="17" opacity="0.4"/>
    <path d="M452 236 C420 258 396 274 380 292" stroke="#8E7A3E" stroke-width="15" opacity="0.4"/>
    <path d="M296 236 C330 258 356 274 374 292" stroke="url(#gsDuct)" stroke-width="13"/>
    <path d="M452 236 C420 258 396 274 380 292" stroke="url(#gsDuct)" stroke-width="11"/>

    <path d="M377 292 C388 336 400 388 414 432 C426 470 446 494 470 508"
          stroke="#8E7A3E" stroke-width="24" opacity="0.4"/>
    <path d="M377 292 C388 336 400 388 414 432 C426 470 446 494 470 508"
          stroke="url(#gsDuct)" stroke-width="19"/>
    <path d="M372 300 C382 340 393 386 406 428"
          stroke="#ffffff" stroke-width="5" opacity="0.34"/>

    <!-- cystic duct, drawn a little wider here because a stone sits at its mouth -->
    <path d="M282 356 C316 344 348 330 372 316" stroke="#8E7A3E" stroke-width="20" opacity="0.4"/>
    <path d="M282 356 C316 344 348 330 372 316" stroke="url(#gsDuct)" stroke-width="16"/>
  </g>

  <!-- =============================== gallbladder =============================== -->
  <path d="M284 352
           C232 330 168 344 140 396
           C112 448 138 512 194 528
           C250 544 300 500 312 442
           C320 404 306 372 292 352 Z"
        fill="url(#gsBody)" stroke="#5E6B33" stroke-width="2.5" stroke-opacity="0.45"/>
  <path d="M176 386 C210 366 250 366 278 382" fill="none" stroke="url(#gsSheen)"
        stroke-width="22" stroke-linecap="round"/>

  <!-- ================================ the stones ================================ -->
  <!-- inside the gallbladder: several, of different sizes, as they usually are -->
  <g stroke="#8E7A3E" stroke-opacity="0.5" stroke-width="1.8">
    <circle cx="196" cy="462" r="30" fill="url(#gsStone)"/>
    <circle cx="248" cy="470" r="20" fill="url(#gsStone)"/>
    <circle cx="214" cy="414" r="16" fill="url(#gsStone)"/>
    <circle cx="258" cy="424" r="11" fill="url(#gsStone)"/>
    <circle cx="176" cy="410" r="9"  fill="url(#gsStone)"/>
    <circle cx="228" cy="500" r="12" fill="url(#gsStone)"/>
  </g>
  <!-- faceting, kept faint: enough to read as a stone rather than a marble -->
  <g fill="none" stroke="#B79A62" stroke-opacity="0.4" stroke-width="1.6">
    <path d="M180 446 L200 438 L214 452"/>
    <path d="M240 462 L252 456 L260 468"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="186" cy="450" rx="9" ry="6" transform="rotate(-24 186 450)"/>
    <ellipse cx="242" cy="462" rx="6" ry="4" transform="rotate(-24 242 462)"/>
  </g>

  <!-- the one that matters: sitting at the neck, where the cystic duct starts -->
  <circle cx="300" cy="352" r="15" fill="url(#gsStone)" stroke="#8E7A3E"
          stroke-width="2" stroke-opacity="0.65"/>
  <circle cx="300" cy="352" r="27" fill="none" stroke="#D4574B" stroke-width="2.6"
          stroke-opacity="0.55" stroke-dasharray="5 6"/>

  <!-- ========================= duodenum, for orientation ========================= -->
  <g fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M470 508 C520 528 566 566 578 610" stroke="#B15E4C" stroke-width="40"/>
    <path d="M470 508 C520 528 566 566 578 610" stroke="url(#gsGut)" stroke-width="34"/>
  </g>
  <circle cx="470" cy="508" r="9" fill="#EFD6AF" stroke="#8E7A3E" stroke-width="2.5"/>

  <!-- ================================= labels ================================= -->
  <g font-family="Inter, 'Segoe UI', sans-serif" fill="#6B534F">
    <g stroke="#C9A79E" stroke-width="1.4" fill="none">
      <path d="M196 492 L186 540 L196 552"/>
      <path d="M172 372 L156 330 L142 324"/>
      <path d="M322 340 L430 318 L452 312"/>
      <path d="M404 400 L520 400 L544 388"/>
    </g>
    <g fill="#C9A79E">
      <circle cx="196" cy="492" r="3.4"/>
      <circle cx="172" cy="372" r="3.4"/>
      <circle cx="322" cy="340" r="3.4"/>
      <circle cx="404" cy="400" r="3.4"/>
    </g>

    <!-- labels sit clear of the organ and inside the viewBox: anything
         anchored further left than this runs off the edge of the frame -->
    <text x="196" y="574" font-size="21" font-weight="600" fill="#4A322E" text-anchor="end">Gallstones</text>
    <text x="196" y="596" font-size="15" text-anchor="end">Formed from bile that</text>
    <text x="196" y="614" font-size="15" text-anchor="end">has become concentrated</text>

    <text x="136" y="316" font-size="21" font-weight="600" fill="#4A322E" text-anchor="end">Gallbladder</text>
    <text x="136" y="338" font-size="15" text-anchor="end">Stores bile</text>
    <text x="136" y="356" font-size="15" text-anchor="end">between meals</text>

    <text x="462" y="306" font-size="21" font-weight="600" fill="#4A322E">A stone at the neck</text>
    <text x="462" y="328" font-size="15">Blocks the outlet, which is why</text>
    <text x="462" y="346" font-size="15">the pain often follows a fatty meal</text>

    <text x="550" y="394" font-size="21" font-weight="600" fill="#4A322E">Common bile duct</text>
    <text x="550" y="416" font-size="15">A stone that passes into it</text>
    <text x="550" y="434" font-size="15">can cause jaundice</text>
  </g>
</svg>
