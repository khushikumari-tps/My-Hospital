<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team Component Demo</title>
    <!-- Tailwind CSS for the premium design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Slide Over Animations */
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slideOut {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        .modal-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-drawer {
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-drawer.active {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-stone-50 font-sans text-stone-800">

    <!-- Our Team Section -->
    <section class="py-24">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            
            <!-- Header Section -->
            <div class="text-center max-w-3xl mx-auto mb-16">
                <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight text-stone-900 mb-6">
                    Meet Our <span class="text-emerald-700">Expert Team</span>
                </h2>
                <p class="text-lg text-stone-600 leading-relaxed">
                    Our multidisciplinary team of specialists is dedicated to providing world-class, compassionate healthcare tailored to your unique needs.
                </p>
            </div>

            <!-- Filter Tabs -->
            <div id="filter-tabs" class="flex flex-wrap justify-center gap-3 mb-16">
                <button class="filter-btn active px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 border bg-emerald-700 text-white border-emerald-700 shadow-md" data-filter="All">All</button>
                <button class="filter-btn px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 border bg-white text-stone-600 border-stone-200 hover:border-emerald-700 hover:text-emerald-700" data-filter="Surgical Oncology">Surgical Oncology</button>
                <button class="filter-btn px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 border bg-white text-stone-600 border-stone-200 hover:border-emerald-700 hover:text-emerald-700" data-filter="Internal Medicine">Internal Medicine</button>
                <button class="filter-btn px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 border bg-white text-stone-600 border-stone-200 hover:border-emerald-700 hover:text-emerald-700" data-filter="Gastroenterology">Gastroenterology</button>
                <button class="filter-btn px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 border bg-white text-stone-600 border-stone-200 hover:border-emerald-700 hover:text-emerald-700" data-filter="Patient Support">Patient Support</button>
            </div>

            <!-- Team Grid -->
            <div id="team-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Cards generated via JS to simulate React state -->
            </div>
        </div>
    </section>

    <!-- Slide-Over / Modal -->
    <div id="bio-modal" class="modal-overlay fixed inset-0 z-50 flex justify-end">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm cursor-pointer" onclick="closeModal()"></div>
        
        <!-- Drawer -->
        <div id="bio-drawer" class="modal-drawer relative w-full max-w-md bg-white h-full shadow-2xl flex flex-col overflow-y-auto">
            <div class="p-6 border-b border-stone-100 flex justify-between items-center bg-stone-50 sticky top-0 z-10">
                <h3 class="text-xl font-bold text-stone-900">Doctor Profile</h3>
                <button onclick="closeModal()" class="p-2 text-stone-400 hover:text-stone-700 transition-colors rounded-full hover:bg-stone-200">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-8" id="modal-content">
                <!-- Content injected via JS -->
            </div>
            
            <div class="p-6 border-t border-stone-100 bg-white mt-auto sticky bottom-0">
                <button class="w-full py-4 rounded-xl text-base font-bold text-white bg-emerald-700 hover:bg-emerald-800 shadow-lg hover:shadow-xl transition-all">
                    Book Appointment
                </button>
            </div>
        </div>
    </div>

    <!-- Vanilla JS Logic equivalent to the React component -->
    <script>
        const teamMembers = [
            {
                id: 1,
                name: 'Dr. Deeksha Kapoor',
                title: 'Senior Consultant',
                department: 'Surgical Oncology',
                image: 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                bio: 'Dr. Deeksha Kapoor is a renowned Surgical Oncologist with over 15 years of experience. She specializes in minimally invasive procedures and has completed fellowships at premier international institutes.',
                qualifications: 'MBBS, MS (General Surgery), MCh (Surgical Oncology)',
                fellowships: ['Fellowship in Advanced Laparoscopic Surgery', 'Fellowship in GI Oncology']
            },
            {
                id: 2,
                name: 'Dr. Shyamal Kumar Sen',
                title: 'Head of Department',
                department: 'Internal Medicine',
                image: 'https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                bio: 'Dr. Sen brings 20 years of expertise in managing complex internal medicine cases. He is passionate about preventive healthcare and chronic disease management.',
                qualifications: 'MBBS, MD (Internal Medicine)',
                fellowships: ['Fellowship in Critical Care Medicine']
            },
            {
                id: 3,
                name: 'Dr. Sachin Kumar',
                title: 'Consultant',
                department: 'Gastroenterology',
                image: 'https://images.unsplash.com/photo-1537368910025-700350fe46c7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                bio: 'Dr. Sachin Kumar is a specialist in pancreato-biliary diseases. He is dedicated to providing state-of-the-art diagnostic and therapeutic endoscopic procedures.',
                qualifications: 'MBBS, MD, DM (Gastroenterology)',
                fellowships: ['Advanced Endoscopy Fellowship']
            },
            {
                id: 4,
                name: 'Ms. Poonam Sharma',
                title: 'Lead Coordinator',
                department: 'Patient Support',
                image: 'https://images.unsplash.com/photo-1594824436998-038e121da0c5?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                bio: 'Poonam Sharma leads our patient support initiatives, ensuring that every patient receives compassionate care, seamless scheduling, and continuous guidance throughout their treatment journey.',
                qualifications: 'BSc Nursing, MHA (Hospital Administration)',
                fellowships: []
            }
        ];

        let activeTab = 'All';

        function renderCards() {
            const grid = document.getElementById('team-grid');
            grid.innerHTML = '';
            
            const filtered = activeTab === 'All' 
                ? teamMembers 
                : teamMembers.filter(m => m.department === activeTab);
                
            filtered.forEach(member => {
                const card = document.createElement('div');
                card.className = "group relative bg-white rounded-3xl overflow-hidden shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-stone-100 transition-all duration-500 hover:-translate-y-2 hover:shadow-[0_20px_40px_-10px_rgba(0,0,0,0.1)]";
                card.innerHTML = `
                    <div class="aspect-[3/4] overflow-hidden relative">
                        <img src="${member.image}" alt="${member.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"/>
                        <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-bold text-emerald-800 shadow-sm">
                            ${member.department}
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-bold text-stone-900 mb-1">${member.name}</h3>
                        <p class="text-sm font-medium text-emerald-700 mb-5">${member.title}</p>
                        <div class="flex flex-col gap-2">
                            <button onclick="openModal(${member.id})" class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200 transition-colors">
                                View Bio
                            </button>
                            <button class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-emerald-700 hover:bg-emerald-800 shadow-md hover:shadow-lg transition-all">
                                Book Appointment
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setupFilters() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Update active state styling
                    buttons.forEach(b => {
                        b.className = "filter-btn px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 border bg-white text-stone-600 border-stone-200 hover:border-emerald-700 hover:text-emerald-700";
                    });
                    const target = e.target;
                    target.className = "filter-btn active px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 border bg-emerald-700 text-white border-emerald-700 shadow-md";
                    
                    activeTab = target.getAttribute('data-filter');
                    renderCards();
                });
            });
        }

        function openModal(id) {
            const member = teamMembers.find(m => m.id === id);
            if (!member) return;

            const content = document.getElementById('modal-content');
            let fellowshipsHtml = '';
            if (member.fellowships.length > 0) {
                const listItems = member.fellowships.map(f => `<li>${f}</li>`).join('');
                fellowshipsHtml = `
                    <div class="bg-stone-50 p-4 rounded-2xl border border-stone-100 mt-6">
                        <h4 class="text-sm font-bold text-stone-900 mb-2 uppercase tracking-wide">Fellowships</h4>
                        <ul class="list-disc list-inside text-stone-700 space-y-1">${listItems}</ul>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="aspect-square rounded-2xl overflow-hidden mb-6 shadow-md">
                    <img src="${member.image}" alt="${member.name}" class="w-full h-full object-cover" />
                </div>
                <h2 class="text-3xl font-extrabold text-stone-900 mb-2">${member.name}</h2>
                <p class="text-lg font-semibold text-emerald-700 mb-1">${member.title}</p>
                <p class="text-sm text-stone-500 font-medium mb-8 uppercase tracking-wider">${member.department}</p>
                
                <div class="space-y-6">
                    <div>
                        <h4 class="text-sm font-bold text-stone-900 mb-2 uppercase tracking-wide">About</h4>
                        <p class="text-stone-600 leading-relaxed">${member.bio}</p>
                    </div>
                    
                    <div class="bg-stone-50 p-4 rounded-2xl border border-stone-100">
                        <h4 class="text-sm font-bold text-stone-900 mb-2 uppercase tracking-wide">Qualifications</h4>
                        <p class="text-stone-700 font-medium">${member.qualifications}</p>
                    </div>
                    ${fellowshipsHtml}
                </div>
            `;

            document.getElementById('bio-modal').classList.add('active');
            document.getElementById('bio-drawer').classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            document.getElementById('bio-drawer').classList.remove('active');
            document.getElementById('bio-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Initialize
        renderCards();
        setupFilters();
    </script>
</body>
</html>
